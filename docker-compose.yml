services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dutybot
      POSTGRES_PASSWORD: dutybot
      POSTGRES_DB: dutybot
    volumes:
      - dutybot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dutybot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dutybot:dutybot@db:5432/dutybot
    depends_on:
      db:
        condition: service_healthy

volumes:
  dutybot_pgdata:
